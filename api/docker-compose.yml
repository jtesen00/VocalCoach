# PostgreSQL para desarrollo local: `docker compose up -d` (en api/).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vocalcoach
      POSTGRES_USER: vocalcoach
      POSTGRES_PASSWORD: vocalcoach
    ports:
      - "5432:5432"
    volumes:
      - vocalcoach-db:/var/lib/postgresql/data
volumes:
  vocalcoach-db:
